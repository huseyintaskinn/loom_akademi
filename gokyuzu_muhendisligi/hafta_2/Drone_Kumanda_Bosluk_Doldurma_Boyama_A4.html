<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Loom Akademi • Gökyüzü Mühendisliği Drone Kumandası Boşluk Doldurma ve Boyama Sayfası (A4)</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 6mm 8mm;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    body {
      width: 194mm;
      height: 283mm;
      margin: 0 auto;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Segoe UI', 'Trebuchet MS', Arial, sans-serif;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Print Button */
    .no-print-bar {
      position: fixed;
      top: 15px;
      right: 20px;
      z-index: 9999;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 15px;
      font-family: 'Segoe UI', Arial, sans-serif;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 2px solid #fff;
      transition: all 0.2s ease;
    }
    .no-print-bar:hover {
      background: #0369a1;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.5);
    }
    @media print {
      .no-print-bar {
        display: none !important;
      }
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    }

    /* TOP SECTION: ID CARD */
    .id-card-wrapper {
      height: 102mm;
      border: 3.5px solid #0284c7;
      border-radius: 16px;
      padding: 10px 18px;
      position: relative;
      background: linear-gradient(145deg, #f0f9ff 0%, #ffffff 40%, #f8fafc 100%);
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Filigree / Watermark Emblem */
    .watermark-emblem {
      position: absolute;
      right: 24mm;
      top: 50%;
      transform: translateY(-50%);
      width: 65mm;
      height: 65mm;
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
    }

    /* ID Card Header */
    .id-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2.5px solid #0284c7;
      padding-bottom: 6px;
      position: relative;
      z-index: 2;
    }
    .id-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .id-brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 3px 8px rgba(2, 132, 199, 0.3);
    }
    .id-title-group h1 {
      font-size: 20px;
      font-weight: 800;
      color: #0369a1;
      letter-spacing: 0.3px;
      line-height: 1.1;
    }
    .id-title-group p {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 1px;
    }
    .id-badge-pill {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.25);
    }

    /* ID Card Body */
    .id-body {
      display: flex;
      gap: 20px;
      align-items: center;
      position: relative;
      z-index: 2;
      flex: 1;
      margin: 6px 0;
    }

    /* Photo Box: COMPLETELY EMPTY as requested */
    .photo-box {
      width: 35mm;
      height: 48mm;
      min-width: 35mm;
      border: 2px dashed #0284c7;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
    }

    /* Balanced 4 Fields */
    .fields-grid {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }
    .field-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .field-label {
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      font-size: 15px;
      min-width: 140px;
      letter-spacing: 0.2px;
    }
    .field-line {
      flex: 1;
      border-bottom: 2px dotted #0284c7;
      height: 20px;
      margin-bottom: 1px;
    }

    /* ID Card Footer */
    .id-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1.5px solid #cbd5e1;
      padding-top: 6px;
      position: relative;
      z-index: 2;
    }
    .id-license-text {
      font-size: 13px;
      font-weight: 800;
      color: #334155;
      letter-spacing: 0.5px;
    }
    .id-license-text span {
      color: #0284c7;
      font-weight: 800;
    }
    .id-stamp-badge {
      background: #fef2f2;
      border: 2px solid #e11d48;
      color: #e11d48;
      padding: 4px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(225, 29, 72, 0.15);
      transform: rotate(-1.5deg);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* DIVIDER: CUT LINE */
    .divider-cut {
      height: 8mm;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 1mm 0;
    }
    .cut-line {
      width: 100%;
      border-top: 2px dashed #94a3b8;
    }
    .cut-badge {
      position: absolute;
      background: #fff;
      padding: 0 14px;
      font-size: 11.5px;
      font-weight: 800;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 12px;
    }

    /* BOTTOM SECTION: COLORING PLANE */
    .coloring-card-wrapper {
      height: 280mm;
      border: 3.5px solid #f59e0b;
      border-radius: 16px;
      padding: 10px 16px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.12);
    }
    .coloring-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f59e0b;
      padding-bottom: 6px;
    }
    .coloring-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .coloring-title h2 {
      font-size: 18px;
      font-weight: 800;
      color: #d97706;
      letter-spacing: 0.3px;
    }
    .coloring-subtitle {
      font-size: 11.5px;
      color: #64748b;
      font-weight: 700;
    }

    /* Plane Image Box */
    .plane-img-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0;
      min-height: 210mm;
      position: relative;
    }
    .plane-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: contrast(1.15);
    }

    /* AR QR Code Badge in Header */
    .ar-qr-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, #f0f9ff, #ecfdf5);
      border: 1.5px solid #0284c7;
      padding: 3px 8px 3px 4px;
      border-radius: 9px;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.15);
    }
    .ar-qr-code-box {
      width: 20mm;
      height: 20mm;
      min-width: 20mm;
      background: #fff;
      border-radius: 5px;
      padding: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #cbd5e1;
    }
    .ar-qr-code-box img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ar-qr-desc {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.5px;
    }
    .ar-tag {
      font-size: 11px;
      font-weight: 900;
      color: #0284c7;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .ar-instruction {
      font-size: 9px;
      font-weight: 700;
      color: #334155;
      line-height: 1.2;
      max-width: 42mm;
    }

    /* AR Optical Corner Markers (Quiver/AR Registration Frame) */
    .ar-corner-mark {
      position: absolute;
      width: 14mm;
      height: 14mm;
      border-color: #0f172a;
      border-style: solid;
      pointer-events: none;
      z-index: 5;
    }
    .ar-corner-mark.top-left {
      top: 1.5mm;
      left: 1.5mm;
      border-width: 3.5px 0 0 3.5px;
      border-top-left-radius: 4px;
    }
    .ar-corner-mark.top-right {
      top: 1.5mm;
      right: 1.5mm;
      border-width: 3.5px 3.5px 0 0;
      border-top-right-radius: 4px;
    }
    .ar-corner-mark.bottom-left {
      bottom: 1.5mm;
      left: 1.5mm;
      border-width: 0 0 3.5px 3.5px;
      border-bottom-left-radius: 4px;
    }
    .ar-corner-mark.bottom-right {
      bottom: 1.5mm;
      right: 1.5mm;
      border-width: 0 3.5px 3.5px 0;
      border-bottom-right-radius: 4px;
    }
    .ar-camera-zone-badge {
      position: absolute;
      bottom: 2.5mm;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border: 1px dashed #64748b;
      padding: 1.5px 10px;
      border-radius: 10px;
      font-size: 8.5px;
      font-weight: 800;
      color: #475569;
      letter-spacing: 0.4px;
      pointer-events: none;
      z-index: 6;
      white-space: nowrap;
    }

    /* ONLY Plane Name Input */
    .plane-name-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border-top: 2px solid #fde68a;
      background: #fffbeb;
      margin: 0 -16px -10px -16px;
      padding: 8px 18px 10px 18px;
      border-radius: 0 0 12px 12px;
    }
    .plane-name-label {
      font-size: 16px;
      font-weight: 800;
      color: #b45309;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .plane-name-line {
      flex: 1;
      border-bottom: 2.5px solid #d97706;
      height: 22px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Print Button -->
  <div class="no-print-bar" onclick="window.print()">
    <span>🖨️</span> Sayfayı Yazdır (A4)
  </div>

  <!-- 3. BOTTOM SECTION: PLANE COLORING -->
  <div class="coloring-card-wrapper">
    <div class="coloring-header">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div class="coloring-title">
          <span>🎨</span>
          <h2>DRONE KUMANDASI • BOŞLUK DOLDURMA & BOYAMA</h2>
        </div>
        <div class="coloring-subtitle">
          Drone Kumandasındaki Boşlukları Aşağıdaki Kelimlerle Doldur ve İstediğin Renklere Boya!
        </div>
      </div>
    </div>

    <!-- Uploaded Plane Image with 4 Optical Corner Markers -->
    <div class="plane-img-box">
      <img src="images/Boyama.jpg" alt="Drone Kumandası Boşluk Doldurma ve Boyama Sayfası">
    </div>
  </div>

</body>
</html>
